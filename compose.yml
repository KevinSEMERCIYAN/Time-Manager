services:
  db:
    image: mariadb:11
    mem_limit: 5g
    cpus: 2.0
    environment:
      TZ: "Europe/Paris"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-root}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-timemanager}"
      MARIADB_USER: "${MARIADB_USER:-timemanager}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-timemanager}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: ./backend
    mem_limit: 2g
    cpus: 1.5
    command: sh -lc "npx prisma migrate deploy || npx prisma db push; node src/index.js"
    environment:
      TZ: "Europe/Paris"
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: "${DATABASE_URL:-mysql://timemanager:timemanager@db:3306/timemanager}"
      SHADOW_DATABASE_URL: "${SHADOW_DATABASE_URL:-mysql://root:root@db:3306/timemanager_shadow}"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: "${MARIADB_DATABASE:-timemanager}"
      DB_USER: "${MARIADB_USER:-timemanager}"
      DB_PASS: "${MARIADB_PASSWORD:-timemanager}"
      DEV_MODE: "false"
      SEED_MAX_USERS: "${SEED_MAX_USERS:-1200}"

      LDAP_URL: ldaps://AD-01.primebank.local:636
      LDAP_BASE_DN: DC=primebank,DC=local
      LDAP_BIND_DN: "${LDAP_BIND_DN}"
      LDAP_BIND_PASSWORD: "${LDAP_BIND_PASSWORD}"
      LDAP_USER_FILTER: "(sAMAccountName={{username}})"
      LDAP_CA_CERT_PATH: /app/certs/primebank-root-ca.cer
      LDAP_TLS_SERVERNAME: AD-01.primebank.local
      LDAP_DIRECT_BIND: "true"
      LDAP_UPN_DOMAIN: primebank.local
      AD_DERIVE_TEAM: "false"
      LDAP_USERS_BASE_DN: "OU=Utilisateurs,DC=primebank,DC=local"
      LDAP_USERS_FILTER: "(&(objectClass=user)(!(objectClass=computer)))"
      LDAP_SYNC_EXCLUDE_USERS: "svc_timemanager,svc_ldap_reader"
      AD_SYNC_ENABLED: "false"
      AD_SYNC_INTERVAL_MINUTES: "2"

      JWT_SECRET: "${JWT_SECRET}"
      JWT_TTL_MINUTES: "15"
      REFRESH_TTL_DAYS: "14"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"

      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_FROM: no-reply@primebank.local

      DEV_AUTH: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/certs/primebank-root-ca.cer:/app/certs/primebank-root-ca.cer:ro
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    mem_limit: 768m
    cpus: 0.5
    expose:
      - "5173"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  reverse-proxy:
    image: nginx:alpine
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "8081:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailpit:
    image: axllent/mailpit:latest
    mem_limit: 256m
    cpus: 0.25
    ports:
      - "8025:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db-data:
